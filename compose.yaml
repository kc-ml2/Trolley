services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .trolley-postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trolley -d trolley"]
      interval: 5s
      timeout: 5s
      retries: 10

  trolley:
    build: .
    image: trolley:local
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:7500:7500"
    environment:
      TROLLEY_CONFIG_FILE: /etc/trolley/trolley.yaml
    volumes:
      - type: bind
        source: ./trolley.yaml
        target: /etc/trolley/trolley.yaml
        read_only: true
        bind:
          create_host_path: false
      - trolley-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  postgres-data:
  trolley-data:
