server:
  public_base_url: http://localhost:7500
catalog:
  # Use the same password as POSTGRES_PASSWORD in .trolley-postgres.env.
  # YAML does not interpolate environment variables.
  database_url: postgres://trolley:REPLACE_WITH_RANDOM_PASSWORD@postgres:5432/trolley
admins:
  emails:
    - admin@example.com
# Configure your existing PostgreSQL databases with least-privilege accounts.
# Do not expose the Trolley catalog as a query Target.
targets: {}
exports:
  directory: /data/exports
  max_rows: 100000
  max_bytes: 100000000
  timeout_seconds: 300
  ttl_seconds: 3600
  max_jobs: 10
# Optional SMTP settings: docs/guide.md
