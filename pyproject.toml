[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trolley"
version = "0.1.0"
description = "A small MCP gateway for approved PostgreSQL operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "mcp>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "tortoise-orm>=1.1.8,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
trolley = "trolley.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trolley"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
