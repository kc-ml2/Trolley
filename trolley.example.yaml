server:
  public_base_url: http://localhost:8000

catalog:
  database_url: sqlite://./trolley.db

# Optional trusted-backend provisioning API; disabled when key is absent or empty.
# Generate a private random key (e.g. openssl rand -hex 32). Never commit the real key.
# This master key can issue user keys with existing admin privileges too.
# See docs/provisioning.md for POST /provision/user.
# provisioning:
#   key: "REPLACE_WITH_RANDOM_SECRET"

# Optional Google Workspace SMTP settings for CLI invitations.
# Remove or leave this section commented out to disable email delivery.
# smtp:
#   host: smtp.gmail.com
#   port: 587
#   security: starttls
#   username: trolley@example.com
#   password: google-app-password
#   from: Trolley <trolley@example.com>
#   timeout: 10

targets:
  payments-db:
    kind: postgresql
    url: postgresql://user:password@127.0.0.1:5432/payments
    # Connection timeout and Operation execution/result safety limits.
    timeout: 10
    query_timeout: 30
    max_rows: 1000
    max_result_bytes: 1000000
